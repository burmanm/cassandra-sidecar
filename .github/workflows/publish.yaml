name: Publish images

on:
  push:
    branches: [analytics_fork]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Check out code into the Go module directory
        uses: actions/checkout@v6
      - id: setup-buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: docker-login-icr
        uses: docker/login-action@v4.6.0
        with:
          username: iamapikey
          password: ${{ secrets.MC_ICR_IO_API_KEY }}
          registry: icr.io
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            icr.io/ds-mission-control-staging/cassandra-sidecar
          tags: |
            type=sha,format=short,prefix=
      - name: Build cassandra-sidecar
        id: docker_build_cassandra_sidecar
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
