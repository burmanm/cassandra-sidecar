name: CI

on:
  pull_request:
    branches: [analytics_fork]
  push:
    branches: [analytics_fork]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Java 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CASSANDRA_REVISION: 6fd83986e91a3ce369d1f2d01a04c8c68c319ae3
      CASSANDRA_DEP_DIR: ${{ github.workspace }}/dtest-jars
      DTEST_JAR: dtest-5.0.6.jar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # Shared test fixtures need dtest classes at compile time only.
      # Unit tests do not start Cassandra or need shaded jars or tarballs.
      - name: Cache Cassandra test fixture dependency
        id: dtest-cache
        uses: actions/cache@v4
        with:
          path: dtest-jars/
          key: unit-dtest-${{ runner.os }}-jdk17-${{ env.CASSANDRA_REVISION }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Checkout Cassandra test fixture sources
        if: steps.dtest-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: apache/cassandra
          ref: ${{ env.CASSANDRA_REVISION }}
          path: .cassandra-test-fixtures

      - name: Build Cassandra test fixture dependency
        if: steps.dtest-cache.outputs.cache-hit != 'true'
        working-directory: .cassandra-test-fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
          ant dtest-jar -Dno-checkstyle=true -Drat.skip=true
          mkdir -p "$CASSANDRA_DEP_DIR"
          cp "build/$DTEST_JAR" "$CASSANDRA_DEP_DIR/$DTEST_JAR"

      - name: Run unit tests
        run: ./gradlew --no-daemon --max-workers=2 test --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results-java-17
          path: |
            build/test-results/**
            build/reports/tests/**
          retention-days: 14
